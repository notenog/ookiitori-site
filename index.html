<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ookiitori | TRPG向けツール</title>
<meta name="description" content="notenog が作っている、TRPG向けのツール置き場">
<link rel="icon" href="/favicon.png">
<style>
:root{--navy:#22264B;--cream:#FFF3D1;--pink:#FFB9CB;--coral:#FF7A8F;--mint:#B5EBCF;--sky:#BDDCFF;--lemon:#FFE066;--sub:#5b5f82;
--font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--navy);font-family:var(--font);line-height:1.8;-webkit-text-size-adjust:100%}
a{color:var(--navy)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.badge{display:inline-block;padding:6px 18px;border-radius:999px;background:var(--navy);color:var(--cream);font-weight:700;font-size:13px;letter-spacing:.12em}
h1{font-size:clamp(52px,11vw,112px);line-height:1;margin:16px 0 8px;letter-spacing:-.04em;font-weight:900}
h2{font-size:clamp(24px,4vw,32px);margin:0 0 6px;font-weight:900;line-height:1.35}
.lead{font-size:clamp(18px,2.6vw,24px);font-weight:700;margin:0 0 12px}
header.hero{position:relative;overflow:hidden;padding:44px 0 36px}
header.hero:before{content:"";position:absolute;right:-160px;top:-200px;width:520px;height:520px;border-radius:50%;background:#FFE08A;z-index:0}
header.hero:after{content:"";position:absolute;left:-180px;bottom:-240px;width:440px;height:440px;border-radius:50%;background:#FFE6B0;z-index:0}
.hero .wrap{position:relative;z-index:1}
.board{position:relative;height:330px;margin:28px 0 0}
.note{position:absolute;border-radius:20px;box-shadow:0 12px 0 rgba(34,38,75,.10);padding:20px 22px}
.clock{left:0;top:40px;width:250px;background:var(--pink);transform:rotate(-4deg)}
.clock .t{font-size:62px;font-weight:300;line-height:1;letter-spacing:-.02em}
.clock .s{font-size:13px;font-weight:700;letter-spacing:.2em;margin-top:6px}
.cal{left:230px;top:0;width:290px;background:#fff;transform:rotate(2deg)}
.cal .h{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:22px;margin-bottom:8px}
.cal .h span{font-size:14px;color:#8A8DB0;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-weight:700;font-size:13px}
.grid b{position:relative;height:30px;display:flex;align-items:center;justify-content:center;font-weight:700}
.grid .today{background:var(--coral);color:#fff;border-radius:50%;width:28px;margin:0 auto}
.grid i{position:absolute;bottom:0;width:5px;height:5px;border-radius:50%;background:#3FB8A0}
.todo{left:520px;top:30px;width:210px;background:var(--mint);transform:rotate(4deg)}
.todo h3{margin:0 0 10px;font-size:18px;letter-spacing:.12em}
.todo div{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;margin:7px 0}
.todo div:before{content:"";flex:0 0 auto;width:16px;height:16px;border-radius:50%;border:2.5px solid var(--navy)}
.todo .done{opacity:.5;text-decoration:line-through}.todo .done:before{background:var(--navy)}
.lnch{left:60px;top:230px;width:270px;background:var(--sky);transform:rotate(3deg);display:flex;gap:14px;justify-content:space-between;padding:20px 24px}
.lnch i{width:44px;height:44px;border-radius:13px;display:block}
.memo{left:560px;top:205px;width:210px;background:var(--lemon);transform:rotate(-3deg);padding:18px 20px}
.memo i{display:block;height:8px;border-radius:4px;background:rgba(34,38,75,.35);margin:11px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chips span{padding:4px 14px;border-radius:999px;background:var(--navy);color:var(--cream);font-weight:700;font-size:14px}
section{padding:36px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:18px}
.card{background:#fff;border-radius:20px;padding:18px 22px;box-shadow:0 8px 0 rgba(34,38,75,.10)}
.card h3{margin:0 0 4px;font-size:19px;font-weight:900}
.card p{margin:0;font-size:15px;color:var(--sub);font-weight:500}
.panel{background:#fff;border-radius:24px;padding:26px 28px;box-shadow:0 10px 0 rgba(34,38,75,.10)}
.panel.sky{background:var(--sky)}
.panel ul{margin:8px 0 0;padding-left:1.2em}
.panel li{margin:4px 0}
.small{font-size:14px;color:var(--sub)}
footer{padding:30px 0 50px;font-size:14px}
footer a{margin-right:18px;font-weight:700}
.en h2{margin-top:0}
.en p,.en li{font-size:15px}
@media (max-width:760px){
 .board{height:auto;display:flex;flex-direction:column;gap:22px;align-items:center}
 .note{position:relative;left:auto!important;top:auto!important;width:min(92%,340px)}
}
.cards{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}.card.tool{display:block;text-decoration:none;transition:transform .15s}.card.tool:hover{transform:translateY(-2px)}</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <span class="badge">TOOLS for TRPG</span>
  <h1>ookiitori</h1>
  <p class="lead">notenog が作っている、TRPG向けのツール置き場</p>
</div></header>
<main><section><div class="wrap">
  <h2>ツール</h2>
  <div class="cards">
    <!-- TOOLS-START：ツールを足すときは、このカードを1枚コピーして書き換える -->
    <a class="card tool" href="/takucale/"><h3>TakuCale</h3><p>卓に特化したカレンダー＆付箋ウィジェット（Windows）</p></a>
    <!-- TOOLS-END -->
  </div>
</div></section></main>
<footer><div class="wrap">
  <a href="mailto:ejika.gyu@gmail.com">お問い合わせ / Contact</a>
  <p class="small">© notenog</p>
</div></footer>
</body>
</html>
